[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiyuan-tfai"
version = "0.1.0"
description = "启元稳态场 AI 预测运行包"
requires-python = ">=3.8.1,<3.14"
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0,<3",
  "pyyaml>=6,<7",
  "matplotlib>=3.7,<4",
  "hydra-core>=1.3,<1.4",
  "h5py>=3.9,<4",
  "vtk==9.2.6",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "tqdm>=4.66,<5",
  "einops>=0.8,<0.9",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=7.3,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tfai*"]

[tool.setuptools.package-data]
"tfai.configs" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
